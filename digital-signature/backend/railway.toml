# Railway deployment manifest for the Digital Signature Service (Part B).
#
# Deployed as a SECOND service inside the SAME project as the main backend
# (e.g. smarttech-prod) so everything stays under a single Hobby-plan credit
# envelope — no new Railway project, no extra paid databases.
#
# Storage reuses the existing external Postgres (same DB as the main backend);
# signature tables (Organisation, SigningKey, Signature, …) live in their own
# schema so they never collide with the school schema.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects PORT automatically; main.ts binds to process.env.PORT.
startCommand = "sh -c \"npx prisma migrate deploy --schema=./prisma/schema.postgres.prisma; node dist/main.js\""
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
