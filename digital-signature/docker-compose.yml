version: '3.8'

# Standalone deployment for the Digital Signature Service (Part B).
#   cp .env.production.example .env  &&  docker compose --env-file .env up -d --build
# The service is logically independent; it does NOT need the main stack to run.

services:
  signature-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sig-service
    environment:
      DATABASE_URL: ${SIG_DATABASE_URL:-file:/app/data/prod.db}
      JWT_SECRET: ${SIG_JWT_SECRET:?set SIG_JWT_SECRET in .env}
      ENCRYPTION_KEY: ${SIG_ENCRYPTION_KEY:?set SIG_ENCRYPTION_KEY in .env}
      INTERNAL_SERVICE_KEYS: ${INTERNAL_SERVICE_KEYS:?set INTERNAL_SERVICE_KEYS in .env}
      CORS_ORIGIN: ${SIG_CORS_ORIGIN:-http://localhost:3100}
      PORT: 4001
      NODE_ENV: production
    ports:
      - "4001:4001"
    volumes:
      - sig_data:/app/data
    restart: unless-stopped

  # Optional operator/issuer UI. Omit with: docker compose up -d signature-service
  signature-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sig-frontend
    environment:
      NEXT_PUBLIC_DSIG_API_URL: ${SIG_NEXT_PUBLIC_API_URL:-http://localhost:4001}
      NODE_ENV: production
    ports:
      - "3100:3000"
    depends_on:
      - signature-service
    restart: unless-stopped

volumes:
  sig_data:
