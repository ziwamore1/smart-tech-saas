name: EAS Update (Mobile OTA)

on:
  push:
    branches: [main]
    paths:
      - 'SmartTechApp/**'

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartTechApp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npx expo install --check
        continue-on-error: true

      - run: npx eas update --branch production --message "Auto OTA: ${{ github.event.head_commit.message }}"
