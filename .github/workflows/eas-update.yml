name: EAS Update (Mobile OTA)

on:
  push:
    branches: [main]
    paths:
      - 'SmartTechApp/**'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SmartTechApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Update
        run: npx eas update --branch production --message "Auto OTA: ${{ github.event.head_commit.message }}"
