version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smarttech-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-smarttech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-school_saas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smarttech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smarttech}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smarttech-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smarttech-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarttech-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-smarttech}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-school_saas}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      PRIVATE_KEY: ${PRIVATE_KEY}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL}
      MINISTRY_ZAMBIA_ENABLED: ${MINISTRY_ZAMBIA_ENABLED:-false}
      MINISTRY_ZAMBIA_API_URL: ${MINISTRY_ZAMBIA_API_URL}
      MINISTRY_ZAMBIA_CLIENT_ID: ${MINISTRY_ZAMBIA_CLIENT_ID}
      MINISTRY_ZAMBIA_CLIENT_SECRET: ${MINISTRY_ZAMBIA_CLIENT_SECRET}
      # Digital Signature Service bridge (Part B) — empty URL = stamp-only mode
      SIGNATURE_SERVICE_URL: ${SIGNATURE_SERVICE_URL:-http://signature-service:4001}
      SIGNATURE_SERVICE_KEY: ${SIGNATURE_SERVICE_KEY:-stamp-engine:dev-internal-service-secret}
      SIGNATURE_SERVICE_TIMEOUT_MS: ${SIGNATURE_SERVICE_TIMEOUT_MS:-15000}
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smarttech-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarttech-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - smarttech-network
    restart: unless-stopped

  # Digital Signature Service (Part B) — opt-in via profile so the default
  # `docker compose up -d` behaviour is unchanged:
  #   docker compose --profile authenticity up -d
  # REQUIRES secrets in .env (never use the insecure placeholders below):
  #   SIG_ENCRYPTION_KEY  (64 hex chars — encrypts Ed25519 private keys at rest)
  #   SIG_JWT_SECRET      (long random — org-session signing)
  #   INTERNAL_SERVICE_KEYS (must match the main backend's SIGNATURE_SERVICE_KEY)
  # Optional override: SIG_DATABASE_URL (defaults to the shared Postgres schema).
  signature-service:
    build:
      context: ./digital-signature/backend
      dockerfile: Dockerfile
    container_name: smarttech-signature-service
    environment:
      # Signature tables (Organisation, SigningKey, Signature, …) live in the
      # shared Postgres by default — no name collisions with the school schema.
      # Override with SIG_DATABASE_URL / SIG_DIRECT_URL to isolate into its own DB.
      DATABASE_URL: ${SIG_DATABASE_URL:-postgresql://${DB_USER:-smarttech}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-school_saas}}
      DIRECT_URL: ${SIG_DIRECT_URL:-postgresql://${DB_USER:-smarttech}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-school_saas}}
      JWT_SECRET: ${SIG_JWT_SECRET:?set SIG_JWT_SECRET in .env}
      ENCRYPTION_KEY: ${SIG_ENCRYPTION_KEY:?set SIG_ENCRYPTION_KEY (64 hex chars) in .env}
      INTERNAL_SERVICE_KEYS: ${INTERNAL_SERVICE_KEYS:?set INTERNAL_SERVICE_KEYS in .env}
      CORS_ORIGIN: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      PORT: 4001
      NODE_ENV: production
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smarttech-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smarttech-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/smarttech.conf:/etc/nginx/conf.d/default.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
      - ./infrastructure/nginx/certbot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - smarttech-network
    restart: unless-stopped

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: smarttech-certbot
    volumes:
      - ./infrastructure/nginx/certbot:/var/www/certbot
      - ./infrastructure/nginx/ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - smarttech-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  smarttech-network:
    driver: bridge
